<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;
const DATA = window.DASHBOARD_DATA;

/* ---------------- constants ---------------- */
const MONTHS = DATA.meta.months;
const MONTH_LABELS = DATA.meta.monthLabels;
const TECHS = DATA.techs;
const PLANTS = DATA.plants.filter(p => p.techCount > 0);
const PLANT_NAMES = PLANTS.map(p => p.name);
const OVERALL = DATA.overall;

const TENURE_BUCKETS = [
  { key: 'lt1', label: '未滿1年', test: t => t < 1 },
  { key: '1-3', label: '1–3年', test: t => t >= 1 && t < 3 },
  { key: '3-5', label: '3–5年', test: t => t >= 3 && t < 5 },
  { key: '5-10', label: '5–10年', test: t => t >= 5 && t < 10 },
  { key: '10-15', label: '10–15年', test: t => t >= 10 && t < 15 },
  { key: '15+', label: '15年以上', test: t => t >= 15 },
];
const tenureBucketOf = t => (TENURE_BUCKETS.find(b => b.test(t)) || {}).key;

const MILEAGE_BUCKETS = [
  { key: 'm0_1', label: '0–1萬公里' },
  { key: 'm1_3', label: '1–3萬公里' },
  { key: 'm3_5', label: '3–5萬公里' },
  { key: 'm5_10', label: '5–10萬公里' },
  { key: 'm10up', label: '10萬公里以上' },
];
const MILEAGE_MID = { m0_1: 5000, m1_3: 20000, m3_5: 40000, m5_10: 75000, m10up: 130000 };

const TYPE_OPTIONS = ['核心戰力', '高產能', '高產值', '需改善', '觀察期'];
const QUAL_OPTIONS = ['正式戰力', '觀察期'];

const DEFAULT_THRESHOLDS = {
  revGapPct: 10, laborLow: 0.24, laborHigh: 0.32,
  warrantyGapPct: 20, compositeGreen: 100, compositeWarn: 90,
  seniorYears: 10, newHireYears: 1,
};

/* ---------------- format helpers ---------------- */
const fmtInt = v => (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString('zh-Hant-TW');
const fmtMoney = v => (v == null || isNaN(v)) ? '—' : 'NT$' + Math.round(v).toLocaleString('zh-Hant-TW');
const fmtPct = (v, d) => (v == null || isNaN(v)) ? '—' : (v * 100).toFixed(d == null ? 1 : d) + '%';
const fmtNum = (v, d) => (v == null || isNaN(v)) ? '—' : v.toFixed(d == null ? 1 : d);
const fmtKm = v => (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString('zh-Hant-TW') + ' km';

/* ---------------- data access helpers ---------------- */
function techKey(t) { return t.plant + '|' + t.name; }
function techMonthly(t, m) { return t.monthly && t.monthly[String(m)]; }

function sumField(t, field, from, to) {
  let s = 0, any = false;
  for (let m = from; m <= to; m++) {
    const r = techMonthly(t, m);
    if (r && typeof r[field] === 'number') { s += r[field]; any = true; }
  }
  return any ? s : null;
}
function techTotalIntake(t, from, to) { return sumField(t, 'total_count', from, to) || 0; }
function techTotalRevenue(t, from, to) {
  let s = 0, any = false;
  for (let m = from; m <= to; m++) {
    const r = techMonthly(t, m);
    if (r && typeof r.total_count === 'number' && typeof r.rev_per_unit === 'number') { s += r.total_count * r.rev_per_unit; any = true; }
  }
  return any ? s : 0;
}
function techAvgRevPerUnit(t, from, to) {
  const intake = techTotalIntake(t, from, to), rev = techTotalRevenue(t, from, to);
  return intake > 0 ? rev / intake : null;
}
function techWeighted(t, field, from, to) {
  let num = 0, den = 0;
  for (let m = from; m <= to; m++) {
    const r = techMonthly(t, m);
    if (r && typeof r.total_count === 'number' && typeof r[field] === 'number') { num += r[field] * r.total_count; den += r.total_count; }
  }
  return den > 0 ? num / den : null;
}
function techMileageSums(t, from, to) {
  const out = { m0_1: 0, m1_3: 0, m3_5: 0, m5_10: 0, m10up: 0 };
  for (let m = from; m <= to; m++) {
    const r = techMonthly(t, m);
    if (!r) continue;
    MILEAGE_BUCKETS.forEach(b => { if (typeof r[b.key] === 'number') out[b.key] += r[b.key]; });
  }
  return out;
}
function techAvgMileage(t, from, to) {
  const sums = techMileageSums(t, from, to);
  let total = 0, weighted = 0;
  Object.keys(sums).forEach(k => { total += sums[k]; weighted += sums[k] * MILEAGE_MID[k]; });
  return total > 0 ? weighted / total : null;
}
function availableMonths(t) {
  return MONTHS.filter(m => { const r = techMonthly(t, m); return r && typeof r.total_count === 'number'; });
}

/* ---------------- RAG logic ---------------- */
function ragComposite(idx, th) {
  if (idx == null || isNaN(idx)) return 'gray';
  if (idx >= th.compositeGreen) return 'good';
  if (idx >= th.compositeWarn) return 'warn';
  return 'critical';
}
function ragRevGap(techRev, plantRev, th) {
  if (techRev == null || !plantRev) return 'gray';
  const gapPct = (plantRev - techRev) / plantRev * 100;
  if (gapPct >= th.revGapPct) return 'critical';
  if (gapPct >= th.revGapPct / 2) return 'warn';
  return 'good';
}
function ragLabor(ratio, th) {
  if (ratio == null) return 'gray';
  if (ratio >= th.laborLow && ratio <= th.laborHigh) return 'good';
  const buf = 0.02;
  if (ratio >= th.laborLow - buf && ratio <= th.laborHigh + buf) return 'warn';
  return 'critical';
}
function ragWarranty(techR, plantR, th) {
  if (techR == null || !plantR) return 'gray';
  const rel = (techR - plantR) / plantR * 100;
  if (rel >= th.warrantyGapPct) return 'critical';
  if (rel >= th.warrantyGapPct / 2) return 'warn';
  return 'good';
}
const SEV_RANK = { critical: 3, warn: 2, good: 1, gray: 0 };
function worstOf(...tags) {
  const real = tags.filter(t => t !== 'gray');
  if (!real.length) return 'gray';
  return real.reduce((a, b) => SEV_RANK[b] > SEV_RANK[a] ? b : a, real[0]);
}
function hasEnoughSample(t) { return t.effectiveMonths == null || t.effectiveMonths >= 2; }

function techOverallRag(t, th) {
  if (!hasEnoughSample(t)) return 'gray';
  return worstOf(
    ragComposite(t.compositeIndex, th),
    ragRevGap(t.weightedRevPerUnit, t.plantAvgRevPerUnit, th),
    ragLabor(t.avgLaborRatio, th),
    ragWarranty(t.warrantyRatio, t.plantAvgWarrantyRatio, th)
  );
}

function decliningStreak(t, field, minLen) {
  const ms = availableMonths(t);
  if (ms.length < minLen + 1) return false;
  const last = ms.slice(-(minLen + 1));
  const vals = last.map(m => techMonthly(t, m)[field]);
  for (let i = 1; i < vals.length; i++) if (!(vals[i] < vals[i - 1])) return false;
  return true;
}

function techAlerts(t, th) {
  const flags = [];
  if (!hasEnoughSample(t)) {
    flags.push({ sev: 'gray', label: '有效上線月數不足（' + (t.effectiveMonths == null ? 0 : t.effectiveMonths) + ' 個月），資料樣本不足以判定戰力' });
    return flags;
  }
  const rc = ragComposite(t.compositeIndex, th);

}

function aggregateForPeriod(techs, month) {
  const from = month, to = month;
  let intake = 0, revenue = 0, laborNum = 0, laborDen = 0, warrantyNum = 0, warrantyDen = 0, mileageNum = 0, mileageDen = 0;
  techs.forEach(t => {
    const r = techMonthly(t, month);
    if (!r || typeof r.total_count !== 'number') return;
    intake += r.total_count;
    if (typeof r.rev_per_unit === 'number') revenue += r.total_count * r.rev_per_unit;
    if (typeof r.labor_ratio === 'number') { laborNum += r.labor_ratio * r.total_count; laborDen += r.total_count; }
    if (typeof r.warranty_ratio === 'number') { warrantyNum += r.warranty_ratio * r.total_count; warrantyDen += r.total_count; }
    MILEAGE_BUCKETS.forEach(b => { if (typeof r[b.key] === 'number') { mileageNum += r[b.key] * MILEAGE_MID[b.key]; mileageDen += r[b.key]; } });
  });
  return {
    techCount: techs.length, intake, revenue,
    avgRevPerUnit: intake > 0 ? revenue / intake : null,
    avgLaborRatio: laborDen > 0 ? laborNum / laborDen : null,
    avgWarrantyRatio: warrantyDen > 0 ? warrantyNum / warrantyDen : null,

}

  { key: 'growth', label: '成長幅度（近2月 vs 前2月）', get: t => growthRate(t), fmt: v => v == null ? '—' : (v * 100).toFixed(1) + '%' },
];
function growthRate(t) {
  const ms = availableMonths(t);
  if (ms.length < 4) return null;
  const last2 = ms.slice(-2), prev2 = ms.slice(-4, -2);
  const a = mean(last2.map(m => techMonthly(t, m).total_count * techMonthly(t, m).rev_per_unit));
  const b = mean(prev2.map(m => techMonthly(t, m).total_count * techMonthly(t, m).rev_per_unit));
  if (a == null || b == null || b === 0) return null;
  return (a - b) / b;
}

/* ---------------- Import page ---------------- */
const IMPORT_FIELDS = ['日期', '服務廠代碼', '服務廠名稱', '技師員工編號', '技師姓名', '到職日期', '職級', '工單號碼', '車牌或車輛識別碼', '車型', '車齡', '進廠里程', '維修類型', '工單類型', '自費／保固／理賠／補償', '工資收入', '零件收入', '鈑噴收入', '其他收入', '總營收', '銷售工時', '出勤工時', '完工狀態', '交車日期'];
const REQUIRED_FIELDS = ['日期', '服務廠名稱', '技師姓名', '工單號碼', '總營收'];

function ImportPage() {
  const [fileName, setFileName] = useState(null);
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  function autoMap(hdrs) {
    const m = {};
    IMPORT_FIELDS.forEach(f => { const hit = hdrs.find(h => String(h).trim() === f); if (hit) m[f] = hit; });
    return m;
  }

  function handleFile(file) {
    if (!file) return;
    setBusy(true); setFileName(file.name);
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: null });
        const hdrs = json.length ? Object.keys(json[0]) : [];
        setHeaders(hdrs); setRows(json); setMapping(autoMap(hdrs));
      } catch (err) { alert('檔案解析失敗：' + err.message); }
      setBusy(false);
    };
    reader.readAsBinaryString(file);
  }

  const validation = useMemo(() => {
    if (!rows.length) return null;
    const errors = []; const seenOrders = new Set(); let dup = 0;
    rows.forEach((r, i) => {
      const rowErrs = [];
      REQUIRED_FIELDS.forEach(f => { const col = mapping[f]; if (!col || r[col] == null || r[col] === '') rowErrs.push(f + ' 缺值'); });
      const orderCol = mapping['工單號碼'];
      if (orderCol && r[orderCol] != null) {
        if (seenOrders.has(r[orderCol])) { rowErrs.push('重複工單號碼'); dup++; }
        seenOrders.add(r[orderCol]);
      }
      const revCol = mapping['總營收'];
      if (revCol && r[revCol] != null && (isNaN(+r[revCol]) || +r[revCol] < 0)) rowErrs.push('總營收數值異常');
      if (rowErrs.length) errors.push({ row: i + 2, msgs: rowErrs });
    });
    return { errors, dup, ok: rows.length - errors.length };
  }, [rows, mapping]);

  return React.createElement('div', null,
    React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'card-title' }, '上傳 Excel／CSV'),
      React.createElement('div', { className: 'drop-zone', onClick: () => fileRef.current.click() },
        React.createElement('input', { type: 'file', ref: fileRef, accept: '.xlsx,.xls,.csv', style: { display: 'none' }, onChange: e => handleFile(e.target.files[0]) }),
        fileName ? '已選擇：' + fileName + '（點擊重新選擇）' : '點擊選擇檔案，或將 .xlsx / .csv 拖放至此'
      ),
      busy ? React.createElement('p', { className: 'foot-note' }, '解析中…') : null
    ),
    headers.length ? React.createElement('div', { className: 'card', style: { marginTop: 14 } },
      React.createElement('div', { className: 'card-title' }, '欄位對應', React.createElement('span', { className: 'hint' }, '系統已嘗試自動比對，可手動調整')),
      React.createElement('div', { className: 'grid grid-3' },
        IMPORT_FIELDS.map(f => React.createElement('div', { key: f, className: 'field' },
          React.createElement('label', null, f + (REQUIRED_FIELDS.includes(f) ? ' *必填' : '')),
          React.createElement(Select, {
            value: mapping[f] || '', onChange: v => setMapping(m => Object.assign({}, m, { [f]: v })),
            options: [{ value: '', label: '未對應' }].concat(headers.map(h => ({ value: h, label: h })))
          })
        ))
      )
    ) : null,
    validation ? React.createElement('div', { className: 'card', style: { marginTop: 14 } },
      React.createElement('div', { className: 'card-title' }, '匯入結果預覽'),
      React.createElement('div', { className: 'grid grid-kpi' },
        React.createElement(Kpi, { label: '總筆數', value: rows.length, formatter: fmtInt }),
        React.createElement(Kpi, { label: '成功筆數', value: validation.ok, formatter: fmtInt }),
        React.createElement(Kpi, { label: '失敗筆數', value: validation.errors.length, formatter: fmtInt }),
        React.createElement(Kpi, { label: '重複工單', value: validation.dup, formatter: fmtInt })
      ),
      validation.errors.length ? React.createElement('div', { className: 'table-wrap', style: { marginTop: 12, maxHeight: 260 } },
        React.createElement('table', null,
          React.createElement('thead', null, React.createElement('tr', null, React.createElement('th', null, '資料列'), React.createElement('th', null, '錯誤原因'))),
          React.createElement('tbody', null, validation.errors.slice(0, 200).map((e, i) => React.createElement('tr', { key: i }, React.createElement('td', null, '第 ' + e.row + ' 列'), React.createElement('td', null, e.msgs.join('、')))))
        )
      ) : React.createElement('div', { className: 'empty-state' }, '所有資料列皆通過驗證。'),
      React.createElement('p', { className: 'foot-note', style: { marginTop: 10 } }, '＊此頁僅供上傳前驗證預覽，尚未寫入正式資料庫；正式上線後可串接公司資料庫或 API 完成寫入。')
    ) : null
  );
}
